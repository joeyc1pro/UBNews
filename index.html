<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBNews</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: Arial; }

html, body {
  height: 100%;
  background: #1c1c1c;
  color: #eee;
  line-height: 1.6;
  padding-bottom: 150px;
  scroll-behavior: smooth;
}

/* Sticky Header */
header {
  position: sticky;
  top: 0;
  background: #0d1117;
  padding: 1rem 2rem;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  z-index: 100;
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
}

header h1 {
  color: #f39c12;
  cursor: pointer;
}

/* Search */
.search-container {
  padding: 1.5rem;
  text-align: center;
  background: #161616;
}

#searchInput {
  width: 60%;
  max-width: 500px;
  padding: 10px;
  border: none;
  border-radius: 5px;
  font-size: 16px;
}

/* News Grid */
.section-title {
  color: #f39c12;
  padding: 2rem 2rem 0 2rem;
  font-size: 1.4rem;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
  padding: 2rem;
}

@media(max-width:650px){
  .news-grid { grid-template-columns: 1fr; }
}

.news-card {
  background: #252525;
  border-radius: 8px;
  overflow: hidden;
  transition: 0.3s;
  cursor: pointer;
}

.news-card:hover {
  transform: scale(1.03);
  background: #1e1e1e;
}

.news-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.news-card-content {
  padding: 1rem;
}

.news-card-content h3 {
  color: #f39c12;
  margin-bottom: 5px;
}

.news-card-content p {
  color: #ccc;
  font-size: 0.95rem;
}

/* Search Results */
.search-results {
  display: none;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
  padding: 2rem;
}

@media(max-width:650px){
  .search-results { grid-template-columns: 1fr; }
}

/* Back to top button */
#topBtn {
  display: none;
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 99;
  font-size: 18px;
  border: none;
  outline: none;
  background-color: #f39c12;
  color: black;
  cursor: pointer;
  padding: 12px;
  border-radius: 50%;
}

#topBtn:hover { background-color: #e08e0b; }

footer {
  background:#0d1117;
  text-align:center;
  padding:1.5rem;
  color:#aaa;
}
</style>
</head>
<body>

<header>
<h1 onclick="location.href='index.html'">UBNews</h1>
</header>

<div class="search-container">
<input type="text" id="searchInput" placeholder="Search UBNews articles..." onkeyup="searchArticles()">
</div>

<h2 class="section-title">Latest News</h2>
<section id="latestNews" class="news-grid"></section>

<h2 class="section-title" id="searchTitle" style="display:none;">Search Results</h2>
<section id="searchResults" class="search-results"></section>

<footer>
<p>© 2026 UBNews</p>
</footer>

<button onclick="topFunction()" id="topBtn" title="Back to top">↑</button>

<script>
const articles = [ 
{
title:"Mine-Laying Operations Reported in Strait of Hormuz",
image:"images/hormuz-mines.jpg",
desc:"Naval mines reportedly deployed in the Strait of Hormuz threaten global oil shipping routes.",
link:"hormuz-mines.html",
date:"2026-03-12"
},
{
title:"US Carrier Group Moves Toward Strait of Hormuz",
image:"images/carrier-hormuz.jpg",
desc:"A United States Navy carrier strike group has moved closer to the Strait of Hormuz.",
link:"carrier-hormuz.html",
date:"2026-03-12"
},
{
title:"US Defense Spending Sees Largest Increase in Decade",
image:"images/defense-spending.jpg",
desc:"Congress approves an $875 billion budget to modernize US military equipment and enhance cyber defenses.",
link:"defense-spending.html",
date:"2026-03-12"
},
{
title:"US Troops Conduct Joint Exercises in Eastern Europe",
image:"images/europe-exercises.jpg",
desc:"US and NATO forces conduct large-scale joint exercises to enhance readiness and interoperability.",
link:"europe-exercises.html",
date:"2026-03-12"
},
{
title:"Thai Cargo Ship Attacked Near Strait of Hormuz",
image:"images/thai-ship.jpg",
desc:"The Thai-flagged Mayuree Naree was hit by missiles near the Strait of Hormuz; 20 crew rescued, 3 remain on board.",
link:"thai-ship.html",
date:"2026-03-12"
},
{
title:"Iran Vows to Keep Strait of Hormuz Closed",
image:"images/iran-strait.jpg",
desc:"Iran's new supreme leader pledges to keep the Strait of Hormuz closed amid escalating regional tensions.",
link:"iran-strait.html",
date:"2026-03-12"
}
];

const latestContainer=document.getElementById("latestNews");
articles.forEach(article=>{
    latestContainer.appendChild(createCard(article));
});

function createCard(article){
    const card=document.createElement("div");
    card.className="news-card";
    card.innerHTML=`
    <a href="${article.link}">
        <img src="${article.image}">
        <div class="news-card-content">
            <h3>${article.title}</h3>
            <p>${article.desc}</p>
        </div>
    </a>`;
    return card;
}

/* SEARCH WITH HIGHLIGHT */
function searchArticles(){
    const input=document.getElementById("searchInput").value.toLowerCase();
    const results=document.getElementById("searchResults");
    const title=document.getElementById("searchTitle");
    results.innerHTML="";

    if(input.length===0){
        results.style.display="none";
        title.style.display="none";
        return;
    }

    const filtered=articles.filter(article=>
        article.title.toLowerCase().includes(input) ||
        article.desc.toLowerCase().includes(input)
    );

    filtered.forEach(article=>{
        const card=createCard(article);
        if(input.length>0){
            const regex = new RegExp(`(${input})`, 'gi');
            card.querySelector('h3').innerHTML = article.title.replace(regex, '<mark style="background:#f39c12;color:black;">$1</mark>');
            card.querySelector('p').innerHTML = article.desc.replace(regex, '<mark style="background:#f39c12;color:black;">$1</mark>');
        }
        results.appendChild(card);
    });

    results.style.display="grid";
    title.style.display="block";
}

/* Back to top button */
const topBtn = document.getElementById("topBtn");
window.onscroll = function() {scrollFunction()};
function scrollFunction(){
    if(document.body.scrollTop > 200 || document.documentElement.scrollTop > 200){
        topBtn.style.display = "block";
    } else { topBtn.style.display = "none"; }
}
function topFunction(){
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
}
</script>
</body>
</html>
