<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBNews - Military & USA News</title>

<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Arial;}

body{
background:#1c1c1c;
color:#eee;
line-height:1.6;
}

/* HEADER */

header{
background:#0d1117;
padding:1rem 2rem;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{color:#f39c12;}

nav a{
margin-left:1rem;
color:#eee;
font-weight:bold;
}

nav a:hover{color:#f39c12;}

/* SEARCH */

.search-container{
padding:1.5rem;
text-align:center;
background:#161616;
}

#searchInput{
width:60%;
max-width:500px;
padding:10px;
border:none;
border-radius:5px;
font-size:16px;
}

/* NEWS */

.section-title{
color:#f39c12;
padding:2rem 2rem 0 2rem;
font-size:1.4rem;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:1.5rem;
padding:2rem;
}

.news-card{
background:#252525;
border-radius:8px;
overflow:hidden;
transition:0.3s;
}

.news-card:hover{
transform:translateY(-5px);
}

.news-card img{
width:100%;
height:180px;
object-fit:cover;
}

.news-card-content{
padding:1rem;
}

.news-card-content h3{
color:#f39c12;
margin-bottom:5px;
}

.news-card-content p{
color:#ccc;
font-size:0.95rem;
}

/* SEARCH RESULTS */

.search-results{
display:none;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:1.5rem;
padding:2rem;
}

footer{
background:#0d1117;
text-align:center;
padding:1.5rem;
color:#aaa;
}

</style>
</head>

<body>

<header>
<h1>UBNews</h1>

<nav>
<a href="#">Home</a>
<a href="#">USA</a>
<a href="#">Military</a>
<a href="#">Global Conflicts</a>
</nav>
</header>

<div class="search-container">
<input
type="text"
id="searchInput"
placeholder="Search UBNews articles..."
onkeyup="searchArticles()"
>
</div>

<h2 class="section-title">Latest News</h2>

<section id="latestNews" class="news-grid"></section>

<h2 class="section-title" id="searchTitle" style="display:none;">Search Results</h2>

<section id="searchResults" class="search-results"></section>

<footer>
<p>© 2026 UBNews - Military & USA News</p>
</footer>

<script>

/* ARTICLE DATABASE */

const articles = [

{
title:"Mine-Laying Operations Reported in Strait of Hormuz",
image:"images/hormuz-mines.jpg",
desc:"Naval mines reportedly deployed in the Strait of Hormuz threaten global oil shipping routes.",
link:"hormuz-mines.html",
date:"2026-03-12"

title:"US Carrier Group Moves Toward Strait of Hormuz",
image:"images/carrier-hormuz.jpg",
desc:"A United States Navy carrier strike group has moved closer to the Strait of Hormuz",
link:"carrier-hormuz.html",
date:"2026-03-12"
}

];


/* SHOW ARTICLES */

const latestContainer=document.getElementById("latestNews");

articles.forEach(article=>{
latestContainer.appendChild(createCard(article));
});


function createCard(article){

const card=document.createElement("div");

card.className="news-card";

card.innerHTML=`

<a href="${article.link}">
<img src="${article.image}">
<div class="news-card-content">
<h3>${article.title}</h3>
<p>${article.desc}</p>
</div>
</a>

`;

return card;
}


/* SEARCH */

function searchArticles(){

const input=document.getElementById("searchInput").value.toLowerCase();

const results=document.getElementById("searchResults");
const title=document.getElementById("searchTitle");

results.innerHTML="";

if(input.length===0){
results.style.display="none";
title.style.display="none";
return;
}

const filtered=articles.filter(article=>
article.title.toLowerCase().includes(input) ||
article.desc.toLowerCase().includes(input)
);

filtered.forEach(article=>{
results.appendChild(createCard(article));
});

results.style.display="grid";
title.style.display="block";

}

</script>

</body>
</html
